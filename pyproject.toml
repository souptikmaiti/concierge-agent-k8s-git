[project]
name = "concierge-agent"
version = "0.1.0"
description = "A2A concierge agent for GitHub and Kubernetes specialists"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "a2a-sdk[postgresql]>=1,<2",
    "google-adk[a2a,db]>=2.10.0,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
concierge-agent = "concierge_agent.server:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
